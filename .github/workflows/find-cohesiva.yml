name: Buscar foto de la cohesiva en la web anterior
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/find-cohesiva.yml"]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar la web anterior y buscar la cohesiva
        run: |
          set -u
          mkdir -p found
          UA="Mozilla/5.0"
          curl -fsSL -A "$UA" https://trainlab.site/ -o found/home.html || true
          # scripts and json referenced by the page
          grep -oE '(src|href)="[^"]+\.(js|json)[^"]*"' found/home.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > found/refs.txt || true
          i=0
          while read -r r; do
            case "$r" in http*) u="$r";; /*) u="https://trainlab.site$r";; *) u="https://trainlab.site/$r";; esac
            i=$((i+1)); curl -fsSL -A "$UA" "$u" -o "found/ref-$i.txt" || true
          done < found/refs.txt
          for p in productos catalogo catalog products api/products api/catalog; do curl -fsSL -A "$UA" "https://trainlab.site/$p" -o "found/page-$(echo $p | tr / -).txt" || true; done
          grep -oiE '.{0,300}cohesiv.{0,600}' found/* > found/cohesiva-context.txt || true
          grep -oiE '(https://trainlab\.site)?/?(assets|media)/[A-Za-z0-9._/-]+\.(png|webp|jpg|jpeg)' found/cohesiva-context.txt | sed -E 's#^/##; s#^https://trainlab\.site/##' | sort -u > found/cohesiva-images.txt || true
          while read -r p; do mkdir -p "found/img/$(dirname "$p")"; curl -fsSL -A "$UA" "https://trainlab.site/$p" -o "found/img/$p" || true; done < found/cohesiva-images.txt
          ls -laR found | head -80
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add found
          git commit -m "Resultado de búsqueda de la cohesiva" || echo "Sin cambios"
          git push
