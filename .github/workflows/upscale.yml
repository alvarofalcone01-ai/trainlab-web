name: Mejorar resolución de fotos (Real-ESRGAN)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/upscale.yml", "sr/upscale.py"]
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Instalar dependencias
        run: |
          pip install --quiet "numpy<2" opencv-python-headless==4.8.1.78
          pip install --quiet torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet basicsr==1.4.2 realesrgan==0.3.0 "numpy<2"
      - name: Mejorar fotos
        run: python sr/upscale.py
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sr/out
          git commit -m "Fotos mejoradas con Real-ESRGAN" || echo "Sin cambios"
          git pull --rebase -q || true
          git push
